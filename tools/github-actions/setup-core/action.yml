name: setup-core
description: Install the Agentic Spring AI core artifacts required by extensions
inputs:
  ref:
    description: Agentic Spring AI git ref
    required: false
    default: 10893c69a3682d691d1a58da56690ebebe88c993
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: agentic-spring-ai/agentic-spring-ai
        ref: ${{ inputs.ref }}
        path: target/agentic-spring-ai
    - name: Install core artifacts
      shell: bash
      run: |
        target/agentic-spring-ai/mvnw -B \
          -f target/agentic-spring-ai/pom.xml \
          -pl :agentic-spring-ai-bom,:agentic-spring-ai-model,:agentic-spring-ai-graph-core,:agentic-spring-ai-agent-framework,:agentic-spring-ai-studio \
          -am -DskipTests install
