name: setup-core
description: Install the ARGI core artifacts required by extensions
inputs:
  ref:
    description: ARGI git ref
    required: false
    default: a49eed1c4e5c08acc035c5e0a9713116bbdae5e7
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: agentic-ai-java/argi
        ref: ${{ inputs.ref }}
        path: target/argi
    - name: Install core artifacts
      shell: bash
      run: |
        target/argi/mvnw -B \
          -f target/argi/pom.xml \
          -pl :argi-bom,:argi-graph-core,:argi-agent-framework,:argi-studio,:argi-starter-builtin-nodes \
          -am -DskipTests install
