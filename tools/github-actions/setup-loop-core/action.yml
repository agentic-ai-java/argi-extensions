name: setup-loop-core
description: Install the unpublished loop core and its test fixtures from a pinned revision
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: agentic-ai-java/argi
        ref: 62701a3c7709075aa389c3d5f8af8533a2081448
        path: target/argi-upstream
        persist-credentials: false
    - name: Restore the loop core compile dependency
      shell: bash
      working-directory: target/argi-upstream
      run: git apply "$GITHUB_ACTION_PATH/snakeyaml.patch"
    - name: Install loop core and test fixtures
      shell: bash
      working-directory: target/argi-upstream
      # Keep test compilation enabled to install the runtime core contract test JAR.
      run: ./mvnw -B -ntp -pl :argi-loop-core -am -DskipTests install
